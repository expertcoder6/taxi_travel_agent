services:
  # ===================================================
  # 1. FastAPI Backend & MCP Server (Python Web Service)
  # ===================================================
  - type: web
    name: ride-booking-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./ride_booking.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PUBLIC_WEBHOOK_URL
        sync: false

  # ===================================================
  # 2. Next.js Dashboard Frontend (Node.js Web Service)
  # ===================================================
  - type: web
    name: ride-booking-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: BACKEND_URL
        fromService:
          type: web
          name: ride-booking-backend
          property: host
